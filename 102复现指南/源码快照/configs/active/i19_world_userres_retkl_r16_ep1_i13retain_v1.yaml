### I-19 re-trained with I-13's own stage-two retention mechanism.
### The frozen I-13 combined adapter (rank-80 SOTA) is merged into the base;
### only a new r16 residual is trained. World rows receive gold CE + weak
### parent KL; the other seven real business tasks (action/topic/material
### desc2sid/sid2desc/video/prod/ad/live) receive parent KL only (CE=0),
### mirroring I-13's own user-residual recipe
### (configs/active/... used by scripts/train/train_user_residual_retkl.py).
### Custom loss routing/mixing lives in scripts/train/train_world_residual_retkl.py;
### training data is built by scripts/data/build_world_residual_retention_v1.py.

model_name_or_path: models/OneReason-0.8B-pretrain-competition
adapter_name_or_path: checkpoints/i13_repro_combined_r80_s875
create_new_adapter: true
trust_remote_code: true
flash_attn: fa2

enable_liger_kernel: false
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

dataset: data_world_residual_retention_v1
dataset_dir: configs/datasets/i19_userres_retention
template: qwen3_nothink
cutoff_len: 4096
packing: false
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8

val_size: 0
eval_strategy: "no"

output_dir: checkpoints/i19_world_userres_retkl_r16_ep1_i13retain_v1
logging_steps: 5
save_strategy: steps
save_steps: 100
save_total_limit: 4
save_only_model: true
plot_loss: true
overwrite_output_dir: false
report_to: wandb
run_name: i19_world_userres_retkl_r16_ep1_i13retain_v1

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.001
bf16: true
seed: 19260821
