### riders_act_v1 —— 名次弹:riders 底盘 + action 加浓(P3 v2)一锅 1ep(2026-07-10,平台名=本名)
### 目标=期望分最大化(用户 07-10 指令"只要名次"):把已证明的 action 增益装回已证明的最高分底盘。
### 数据 = data_riders_fk(37,267,0.9177 原封)+ p3_v2_extra(~2,600,B线三修正:[搜索]行注入
###   [评测历史 18-45% 为搜索行、训练此前零覆盖]/长k层 20-45[gold k p75=19,欠输出吃 recall]/
###   评测五元 few-shot 含文本项;gold 程序可复核,build_p3_quote_stop_v2.py verify 全过后方可入锅)。
### 证据链:①ep5_rider 实证浓缩骑手→action 0.0924+时长58min(终止纪律可修);②riders 实证同款骑手
###   一锅 1ep 零蚀(mat7/video8/ad99/live122 全保);③本发=一锅式加浓,预期 action 落 0.0655 与
###   0.0924 之间;④新增行全用户域复制任务,不写 itemic 映射 ⇒ mat/rec 结构性低风险。
### 预登记:
###   ①总分带 0.93-0.95,地板≈0.91(底盘未动);判据 action≥0.075 即成功、≥0.085 达标;
###   ②物料应保 0.2146(零噪声哨兵,若跌=一锅稀释理论翻案);video≥8/ad·live 噪声带内;
###   ③评测时长应显著短于 riders 的 66.7min(终止纪律仪表);
###   ④仪表关:precheck 保险丝 + probe_v2 否决(<30 作废;本发不指望物料涨)+ action 留出集
###     (p3_v2_extra_val 150 条)逐字率≥95%、序合规≥95%。
### 训完流程:merge → precheck → probe_v2 → val 行为读数 → 全过即打包提传。
