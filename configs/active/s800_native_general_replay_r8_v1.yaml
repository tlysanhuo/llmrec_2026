### Small official-native General replay over the current s800 parent.
### Prepared for a single-GPU GLM Platform Training Task; never run this
### formal entry on the development machine.
###
### Causal contract:
### - Unique parent/reference: e3_userres_r80_retkl_v3_s800, whose repeat
###   online score is 1.0048 and world component is 0.1398.
### - LLaMA-Factory merges s800 r80 into O6, then creates a fresh r8/alpha8
###   residual. disable_adapter() is the exact merged-s800 KL reference.
### - The 129 task-fit-reviewed official native General rows occur once and
###   receive full-response CE + 0.05 parent KL. They are official SFT
###   supervision, not independently verified factual gold.
### - The 384 unchanged parent-distribution rows are exactly 48 from each of
###   material desc2sid/sid2desc, action/topic, and video/prod/ad/living.
###   They receive 4.0 parent KL only and no gold CE.
### - Runtime CE/KL routing is fail-closed by exact qwen3_nothink assistant-
###   target token hashes, not by discarded JSONL metadata or text heuristics.
