### I-13_REPRODUCTION_STAGE_2: train the I-12 r16 user residual on stage 1.
### The custom trainer supplies user CE/weak parent KL and non-user parent KL.
### Paths, output name, run name, and overwrite protection differ from the
### historical launch; every model/data/loss/optimizer field is preserved.

model_name_or_path: models/OneReason-0.8B-pretrain-competition
adapter_name_or_path: checkpoints/i13_repro_parent_r64_ep3
create_new_adapter: true
trust_remote_code: true
flash_attn: fa2

enable_liger_kernel: false
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

dataset: data_user_residual_retention_v1
dataset_dir: configs/datasets/i13_highscore
template: qwen3_nothink
cutoff_len: 16384
packing: false
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8

val_size: 0
eval_strategy: "no"

output_dir: checkpoints/i13_repro_residual_r16_retkl_ep1
logging_steps: 5
save_strategy: "no"
plot_loss: true
overwrite_output_dir: false
report_to: wandb
run_name: i13_repro_residual_r16_retkl_ep1

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.001
bf16: true
seed: 19260821
