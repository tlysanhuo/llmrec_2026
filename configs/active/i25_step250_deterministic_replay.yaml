### I-25 incident recovery: deterministic clean replay through optimizer step 250.
###
### This is not a new experiment and it must never resume from an I-25
### checkpoint.  The completed formal I-25 run reached step 1,527, but
### Transformers rotated checkpoint-250 when the end-of-training checkpoint
### was saved under save_total_limit=6.  A dedicated Trainer callback stops
### only after the step-250 optimizer and scheduler updates while leaving the
### planned horizon at the original 1,527 steps.  Therefore the first 250
### updates use the original cosine schedule rather than a 250-step schedule.
###
### Relative to configs/active/i23_actionres_r16_ansretkl_ep1.yaml, only
### output_dir and run_name differ.  All model, data, loss, optimizer,
### scheduler, precision, seed, dataloader, and checkpoint fields are copied
### exactly.  The recovery launcher accepts the result only if the step-250
### adapter/config hashes match the values observed before rotation:
###   adapter 4af7296737209fb00df4908a09e21382ac6a9c987663b658e2f58e123fc928e9
###   config  6c127a34b497e7a8672763b238a50801dd9a3e6cbb662c3c981f9a9b4a4e976a
### A mismatch is a deterministic-replay failure and is never installed.
