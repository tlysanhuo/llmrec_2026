### I-34 is a pre-registered, pending-admission experiment.  This file may
### reference the expected formal D(O1) artifact, but it must not be launched
### while the checkpoint gate says PREREGISTERED_PRECOMPUTE_ONLY.
###
### Frozen provenance is recorded in
### configs/evaluation/i34_r96_material_beam_margin_checkpoint_gate.json:
### source=data_seed_teacher_v1 (D(O1)); builder=scripts/eval/generate_i34_
### material_beam_gap_v1.py plus the registered pool builder; expected formal
### mix=128 material hard-gap rows + 384 retention rows (1:3), seed=19260834.
### The final data and sidecar SHA256 values are intentionally not guessed;
### the launcher requires I34_TRAINING_DATA_SHA256 and I34_SIDECAR_SHA256 after
### deterministic admission and ASSETS.md registration.
###
### The Python entrypoint is mandatory.  It patches
### llamafactory.train.sft.trainer.CustomSeq2SeqTrainer and then calls the
### same llamafactory.train.tuner.run_exp() dispatched by
### `llamafactory-cli train`; invoking llamafactory-cli directly would skip the
### I-34 loss and route checks.

