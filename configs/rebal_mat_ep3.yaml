### rebal_mat_ep3 —— 两头兼顾候选(2026-07-03 深夜,平台上传名=本名)
### 依据 rebal_world_ep3(0.9009)归因的首选假设:物料分=video_ad子空间曝光量函数,
###   直接上采样物料desc2token(1814→5000)补子空间曝光,不经由video推荐样本(已证纯冗余)。
### 数据 data_rebal_mat(32205条, build_rebalanced.py --mat_target 5000):
###   = data_rebal_world 配比(video6000/ad·living·prod各4000/通识2824) + 物料desc2token 1814→5000
### 超参 = seed_ep3/rebal_world_ep3 原封不动: lr2e-5/3ep/batch4/cutoff32768/单卡
### 单变量 vs rebal_world_ep3: 仅 +3186 条物料上采样(总量29019→32205)
### 目标: 物料回0.24+(2453水平) & 保住 action 0.073/世界 0.143/ad 0.058 → 0.92+
