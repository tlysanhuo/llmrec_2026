### quality_swap_v1_lora_ep1 —— riders_fk_lora_ep1 等量换好数据版(2026-07-07)
### 背景:用户裁定不加数据,而是把低价值旧 user/action/topic 行换成官方形态更强的数据。
### 数据 = scripts/data/build_quality_swap_v1.py 产出 37267 条(seed=2026):
###   从 frinkleko_alpaca_32705 删除旧 action_select 1254 + 旧 topic_chain 1253
###   加入 U1 action-select 354(367 raw 按 _src_idx 去重) + U2 candidate-chain MC 353 + U3 topic-chain 2372
###   保留 riders_fk 的 world_zh 2824 + P3 1500 + world_mc_clean 238
###   为严格等量,再从剩余 FK 中删除最长 CoT 行 572 条(mat_or_rec 441,itemic_answer 131)
### 训练 = 完全照抄 riders_fk_lora_ep1: LoRA r32/lr2e-4/1ep/seq32768/packing/nothink。
