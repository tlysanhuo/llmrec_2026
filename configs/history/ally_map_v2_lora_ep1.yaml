### ally_map_v2_lora_ep1 — corrected Ally map package (2026-07-08, platform name = file name)
### Background:
###   quality_swap_v1_lora_ep1 scored 0.8235 online and disproved the "replace old user rows
###   with official-shape user rows" branch.  Ally-map remains a separate high-upside clue, but
###   v1 allocated rec_loo according to the old mistaken panel order.
### Data = scripts/data/build_ally_map_v2.py, 45267 rows:
###   data_riders_fk 37267 (current best base, 0.9177)
###   + rec_loo_v2 5000 corrected to official rec order value:
###       video 2000, prod 1500, ad 800, living 700
###   + fresh_mat 3000 (750/domain, same as v1)
### Training = same as riders_fk_lora_ep1:
###   LoRA r32/alpha32/dropout0.05/lr2e-4/1ep/seq32768/packing/qwen3_nothink/liger on.
### Expected score, pre-registered:
###   median 0.94-0.95; reasonable band 0.91-0.98; 0.99 is upside, not expectation.
###   Hard reads: mat 7 -> no fresh_mat gain; mat 8 -> likely 0.965-0.98 branch.
###   Main target is video/prod rec recovery without killing riders' world/action base.
### Launch:
###   source scripts/env.sh
