### fk_lora_embed_ep1 —— LoRA+解冻embedding:单变量拆物料天花板(2026-07-04,平台名=本名,用户已批准)
### 理论:八分项=三种学习类型,需按参数区域分配可塑性。LoRA(中层低秩护栏=保ad先验)+
###   additional_target 全秩放开 embed_tokens/lm_head(SID绑定所在=拆物料2146天花板,≈50M/6%参数)。
### 锚点:Frinkleko 0.9107(LoRA r32/lr2e-4/1ep,embedding冻结,物料2146/ad 0.1498);
###   本实验=其配方+我方fk_fuse数据(world_zh+fresh_mat)+解冻embedding,主变量只有解冻。
### 出分判读预登记(07-04):
###   ①物料(零噪声): >0.2146 ⇒ "物料天花板=embedding冻结"证实(通往0.95钥匙);=2146 ⇒ 知识在中层FFN,转freeze方案
###   ②ad: ≥0.12 ⇒ 解冻无连带伤害(P=60%);<0.08 ⇒ embedding漂移伤中层读数,主风险暴露
###   ③挤占检查(滿栀警报): rec分项集体<锚点且世界>0.148 ⇒ 下一版通识砍半
###   ④lr2e-4对全秩embedding偏热的风险:盯val曲线,异常即停
