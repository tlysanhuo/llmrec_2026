### official_rec_v3_lora_ep1 — official UserProfile recommendation reconstruction (2026-07-08)
### Goal:
###   Replace old video-heavy recommendation rows with official-distribution,
###   multi-domain next-item rows built only from official UserProfile + Pid2Sid.
###
### Data = scripts/data/build_official_rec_v3.py, 37267 rows:
###   base data_riders_fk 37267
###   - 8000 old recommendation rows, removed from the over-heavy video target bucket
###   + official_rec_v3_block 8000:
###       video 2500 / prod 2000 / ad 1750 / living 1750
###   Total size unchanged.  Full QC:
###       leak 0, bad format 0, bad domain order 0, missing /no_think 0
###       prompt chars p50 10172.5 / p90 14386 / max 22474
###
### Training = riders_fk_lora_ep1 regime:
###   LoRA r32/alpha32/dropout0.05/lr2e-4/1ep/seq32768/packing/qwen3_nothink/liger.
###
### Expected read:
###   This is not an Ally-map bet and not a caption/material expansion.  Main signal should be
###   recommendation subitems, especially prod/ad/live recovery after reducing redundant video SFT rows.
