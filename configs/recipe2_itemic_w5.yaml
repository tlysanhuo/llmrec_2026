### recipe2: recipe1 训练配方 + itemic token 损失加权 (W=5)
### 单变量 vs recipe1: 仅加 itemic 加权 loss(scripts/train/train_itemic_weighted.py 注入)
### 依据: 榜一指路"模型对itemic不友好,加强训练"; 官方文档明示"商品token加权"
### 注意: enable_liger_kernel 必须 false(fused CE 不物化 logits, 与自定义 loss 冲突)
model_name_or_path: /lustre/prod_glm_volumes/volume-20260201002229-o7c51/llmrec_2026/models/OneReason-0.8B-pretrain-competition
trust_remote_code: true
flash_attn: fa2

stage: sft
do_train: true
finetuning_type: full
enable_liger_kernel: false

dataset: data_final
dataset_dir: /lustre/prod_glm_volumes/volume-20260201002229-o7c51/ai_runtime/llmrec_2026/LLaMA-Factory/data
template: qwen3_nothink
cutoff_len: 32768
packing: true
neat_packing: true
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8

### 验证集监控(同 recipe1)
val_size: 0.03
eval_strategy: steps
eval_steps: 20
per_device_eval_batch_size: 1
compute_accuracy: true

output_dir: /lustre/prod_glm_volumes/volume-20260201002229-o7c51/llmrec_2026/checkpoints/recipe2_itemic_w5
logging_steps: 5
save_strategy: epoch
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: wandb
run_name: recipe2_itemic_w5

### train — 同 recipe1 batch/lr; 2 epoch(榜一只训1轮,2ep足够+省时,cosine横跨2轮)
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 1.0e-4
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
pure_bf16: true
seed: 19260817
