### capcot_v1 —— 官方种子 rec 行 CoT 语义重构 × riders LoRA 配方 × 1ep(2026-07-09,平台名=本名)
### 数据 = data_capcot_v1(32,480 行,md5 1c8bc4bc):官方种子原样,仅 3,450 条 rec 行的 think 被
###   原位重构(官方四步框架,内容逐句溯源官方 Caption/Tag;gold 不进 think,按 gold 类目组级过滤,
###   不合格组回退原 think;prompt/答案/标记/行序 零字节改动,构建器断言)。
### 单变量对照:vs seed_raw_lora_ep1(纯官方种子)唯一差异=3,450 条 think 内容(18% rec 行,保守首版)。
### 官方依据:Tips"CoT优化空间大"+四步框架;产线"不看gold生成、按相关性过滤";07-09 Caption/Tag 发布留言
###   "探索不同 CoT 构造方式对推荐任务表现的影响"。
### 机制:rec 评测一半 beam 走 think 通路(think 质量=候选质量);物料 grounding 95% 住 rec 行 think 且
###   需搭"同题多答案"结构(capg 点映射行探针证伪了别的载体)——本实验是 grounding 经由正确载体的首测。
### 训完流程:merge → precheck → probe_v2 → 读数与包放桌面,评测决策不在本配置的职责内。
