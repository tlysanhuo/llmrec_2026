### rebal_focal_ep3 —— focal loss 单变量实验(2026-07-04,平台名=本名)
### 依据: 选手对账"平台训练=focal+token加权,本地=CE";克西指路"加强训练/对itemic不友好";
###   平台文档"难样本聚焦"。focal=跷跷板对症机制(自动降权已学会的头部、提权难样本),
###   与 recipe2 全区均匀加权(0.7692翻车)机制不同——按difficulty自适应。
### 单变量 vs rebal_world_ep3(0.9009): 数据/超参全同,仅 loss CE→focal(γ=2)
### 启动方式(不是llamafactory-cli!): 
###   FOCAL_GAMMA=2.0 python scripts/train/train_focal.py configs/rebal_focal_ep3.yaml
### ⚠️enable_liger_kernel 必须 false(fused CE不物化logits);显存/速度会比liger版差,
###   预计单卡时长 ~1.5-2h(CE分块+checkpoint换显存)
### 归因预登记: 若"跷跷板税=CE人祸"假设成立→物料/ad同涨(史上首次同框);
###   物料掉→focal压了grounding头部;总分<0.89→γ=2过猛,退γ=1
