### New 1-epoch single-GPU experiment template. Copy into configs/active/ before use.

### model
model_name_or_path: /lustre/prod_glm_volumes/volume-20260201002229-o7c51/llmrec_2026/models/OneReason-0.8B-pretrain-competition
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
enable_liger_kernel: true

### dataset
dataset: data_final
dataset_dir: /lustre/prod_glm_volumes/volume-20260201002229-o7c51/ai_runtime/llmrec_2026/LLaMA-Factory/data
template: qwen3_nothink
cutoff_len: 32768
packing: true
neat_packing: true
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: /lustre/prod_glm_volumes/volume-20260201002229-o7c51/llmrec_2026/checkpoints/RUN_NAME
logging_steps: 5
save_strategy: "no"
plot_loss: true
overwrite_output_dir: true
report_to: wandb
logging_dir: /lustre/prod_glm_volumes/volume-20260201002229-o7c51/llmrec_2026/checkpoints/RUN_NAME/tb

val_size: 0.0
eval_strategy: "no"

### train
# 单卡: bs1 * grad_accum4 = global batch 4 (对齐官方单卡)
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.001
bf16: true
seed: 19260817
